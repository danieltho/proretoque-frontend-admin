services:
  admin:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8001/api/v1}
      - VITE_BASE_URL=${VITE_BASE_URL:-http://localhost:8000}
      - CHOKIDAR_USEPOLLING=true
    # Linux: route host.docker.internal to the host gateway.
    # macOS/Windows Docker Desktop already resolves it natively.
    extra_hosts:
      - "host.docker.internal:host-gateway"
